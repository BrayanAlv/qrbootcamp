server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # holgura por si la lista de invitados crece (API limita en 1mb)
  client_max_body_size 2m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # El tráfico /api va a la API interna. Se usa variable + resolver para que
  # nginx re-resuelva el hostname vía DNS de Docker si el contenedor se recrea.
  # Se usa el nombre de CONTENEDOR (qr-api) — único en el host — para evitar
  # colisiones con otro servicio llamado "api" en la red compartida de NPM.
  # X-Forwarded-For/Proto se pasan tal cual (NPM ya los puso) para que el API
  # con trust proxy = 1 vea la IP real del cliente.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://qr-api:3100;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Los assets de Vite tienen hash: cache largo e inmutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: fallback a index.html, sin cache
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}