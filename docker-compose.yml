name: qr-invitations

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: qr-web
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api/v1
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5573:5173"
    depends_on:
      - api
    networks:
      - backend

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: qr-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # Chromium corre como root dentro del contenedor; el sandbox no es usable
      # ("Running as root without --no-sandbox is not supported"), se desactiva.
      - PDF_CHROMIUM_NO_SANDBOX=true
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    ports:
      - "3080:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  mongodb:
    image: mongo:8
    container_name: qr-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: qr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  mongodb_data:
  redis_data:
  web_node_modules:
  api_node_modules:

networks:
  backend: